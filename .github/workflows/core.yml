name: Linux LLVM SDK verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LLVM_VERSION: "22.1.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install the full LLVM SDK
        id: llvm-sdk
        uses: yasuo-ozu/llvm-full@e2588734329213f1da3e8f7ed62215642759bf64 # v1.0.0
        with:
          version: ${{ env.LLVM_VERSION }}
          directory: ${{ runner.temp }}/llvm
          target: linux-x86_64
          fallback: false

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=${{ steps.llvm-sdk.outputs.prefix }}/bin/clang
          -DCMAKE_CXX_COMPILER=${{ steps.llvm-sdk.outputs.prefix }}/bin/clang++
          -DREPOTRAVERSE_LLVM_ROOT=${{ steps.llvm-sdk.outputs.prefix }}

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: >-
          ctest --test-dir build --parallel 2 --timeout 120
          --output-on-failure
