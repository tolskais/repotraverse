name: Windows LLVM SDK verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      LLVM_VERSION: "22.1.0"
    steps:
      - uses: actions/checkout@v4

      - name: Initialize the x64 MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install the full LLVM SDK
        id: llvm-sdk
        uses: yasuo-ozu/llvm-full@e2588734329213f1da3e8f7ed62215642759bf64 # v1.0.0
        with:
          version: ${{ env.LLVM_VERSION }}
          directory: ${{ runner.temp }}/llvm
          target: windows-msvc
          fallback: false

      - name: Validate the LLVM SDK
        shell: pwsh
        env:
          LLVM_FULL_ROOT: ${{ steps.llvm-sdk.outputs.prefix }}
        run: |
          $required = @(
            "bin/clang-cl.exe",
            "lib/cmake/llvm/LLVMConfig.cmake",
            "lib/cmake/clang/ClangConfig.cmake",
            "lib/clangTooling.lib",
            "lib/clangIndex.lib"
          )
          foreach ($relative in $required) {
            $path = Join-Path $env:LLVM_FULL_ROOT $relative
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "LLVM SDK file is missing: $path"
            }
          }
          $licenseUrl = "https://raw.githubusercontent.com/llvm/llvm-project/llvmorg-$env:LLVM_VERSION/LICENSE.TXT"
          Invoke-WebRequest -Uri $licenseUrl `
            -OutFile (Join-Path $env:LLVM_FULL_ROOT "LICENSE.TXT")
          "REPOTRAVERSE_LLVM_ROOT=$env:LLVM_FULL_ROOT" >> $env:GITHUB_ENV
          Write-Host "LLVM SDK root: $env:LLVM_FULL_ROOT"

      - name: Enable Win32 long paths
        shell: pwsh
        run: |
          New-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name LongPathsEnabled -Value 1 -PropertyType DWORD -Force

      - name: Build and test
        shell: pwsh
        run: .\tools\build-windows.ps1 -Mode Generic -Jobs 2

      - name: Package and smoke test
        shell: pwsh
        run: .\tools\package-windows.ps1 -Mode Generic

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: repotraverse-windows-x64-generic
          path: out/package/repotraverse-windows-x64-generic.zip
          if-no-files-found: error
